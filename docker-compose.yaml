services:
  db:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: radar, POSTGRES_PASSWORD: radar }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    environment: { GENERIC_TIMEZONE: Europe/Moscow, TZ: Europe/Moscow }
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata: {}
  n8ndata: {}